# jalankan: docker compose up -d --build
# buka    : http://localhost:8080
# nama project dipatok supaya tidak menabrak stack lain di folder yang sama
name: hongyun

services:
  hongyun:
    build:
      context: .
      dockerfile: Dockerfile
    image: hongyun-app:latest
    container_name: hongyun-app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
