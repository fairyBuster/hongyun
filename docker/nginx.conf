server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml font/woff font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # aset ber-hash dari Vite boleh di-cache lama
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # entry html jangan di-cache supaya update langsung kepakai
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /game.html {
        add_header Cache-Control "no-cache";
    }

    # routing memakai hash (#/game/mw1), fallback ini hanya jaring aman
    location / {
        try_files $uri $uri/ /index.html;
    }
}
